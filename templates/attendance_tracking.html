<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Công Nhân Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        #preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .attendance-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center text-white mb-4">
            <i class="fas fa-user-clock"></i> Hệ Thống Chấm Công Nhận Diện Khuôn Mặt
        </h1>

        <div class="row">
            <!-- Upload & Recognition Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-camera"></i> Chấm Công</h4>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>Chọn ảnh hoặc chụp ảnh:</label>
                            <input type="file" class="form-control-file" id="imageInput" accept="image/*" capture="camera">
                        </div>
                        <div class="text-center">
                            <img id="preview" style="display: none;">
                        </div>
                        <button class="btn btn-primary btn-block mt-3" id="recognizeBtn" disabled>
                            <span class="loading spinner-border spinner-border-sm" role="status"></span>
                            <span id="btnText">Nhận Diện & Chấm Công</span>
                        </button>

                        <div id="result" class="mt-3" style="display: none;">
                            <div class="alert" id="resultAlert"></div>
                        </div>
                    </div>
                </div>

                <!-- Register New Employee -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-plus"></i> Đăng Ký Nhân Viên Mới</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>Tên nhân viên:</label>
                            <input type="text" class="form-control" id="employeeName" placeholder="Nhập tên nhân viên">
                        </div>
                        <div class="form-group">
                            <label>Ảnh khuôn mặt:</label>
                            <input type="file" class="form-control-file" id="employeeImage" accept="image/*" capture="camera">
                        </div>
                        <button class="btn btn-success btn-block" id="registerBtn">
                            <i class="fas fa-save"></i> Đăng Ký
                        </button>
                    </div>
                </div>
            </div>

            <!-- Attendance Records Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-list"></i> Danh Sách Chấm Công Hôm Nay</h4>
                    </div>
                    <div class="card-body attendance-list">
                        <button class="btn btn-sm btn-info mb-3" id="refreshBtn">
                            <i class="fas fa-sync"></i> Làm mới
                        </button>
                        <button class="btn btn-sm btn-secondary mb-3 ml-2" id="viewAllBtn">
                            <i class="fas fa-history"></i> Xem tất cả
                        </button>
                        <div id="attendanceList">
                            <p class="text-center text-muted">Đang tải...</p>
                        </div>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-bar"></i> Thống Kê</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-6">
                                <h3 class="text-primary" id="todayCount">0</h3>
                                <p>Đã chấm công hôm nay</p>
                            </div>
                            <div class="col-md-6">
                                <h3 class="text-success" id="totalEmployees">0</h3>
                                <p>Tổng nhân viên</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Image preview
        $('#imageInput').on('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $('#preview').attr('src', e.target.result).show();
                    $('#recognizeBtn').prop('disabled', false);
                };
                reader.readAsDataURL(file);
            }
        });

        // Recognize and mark attendance
        $('#recognizeBtn').on('click', function() {
            const fileInput = $('#imageInput')[0];
            if (!fileInput.files[0]) {
                alert('Vui lòng chọn ảnh!');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            $('.loading').addClass('active');
            $('#btnText').text('Đang nhận diện...');
            $('#recognizeBtn').prop('disabled', true);

            $.ajax({
                url: `${API_BASE}/attendance/recognize`,
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    $('.loading').removeClass('active');
                    $('#btnText').text('Nhận Diện & Chấm Công');
                    $('#recognizeBtn').prop('disabled', false);

                    if (response.success && response.recognized > 0) {
                        let message = `<strong>Thành công!</strong><br>`;
                        message += `Tìm thấy ${response.total_faces} khuôn mặt, nhận diện được ${response.recognized} người.<br><br>`;

                        response.results.forEach(person => {
                            const status = person.already_marked ? '(Đã chấm công trước đó)' : '(Mới chấm công)';
                            message += `<strong>${person.name}</strong> - ${(person.confidence * 100).toFixed(1)}% ${status}<br>`;
                        });

                        $('#resultAlert').removeClass('alert-danger').addClass('alert-success').html(message);
                        $('#result').show();

                        // Refresh attendance list
                        loadTodayAttendance();
                    } else {
                        $('#resultAlert').removeClass('alert-success').addClass('alert-warning')
                            .html('<strong>Không nhận diện được!</strong><br>Không tìm thấy nhân viên nào trong hệ thống.');
                        $('#result').show();
                    }
                },
                error: function(xhr) {
                    $('.loading').removeClass('active');
                    $('#btnText').text('Nhận Diện & Chấm Công');
                    $('#recognizeBtn').prop('disabled', false);

                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Có lỗi xảy ra!';
                    $('#resultAlert').removeClass('alert-success').addClass('alert-danger')
                        .html(`<strong>Lỗi!</strong><br>${error}`);
                    $('#result').show();
                }
            });
        });

        // Register new employee
        $('#registerBtn').on('click', function() {
            const name = $('#employeeName').val().trim();
            const fileInput = $('#employeeImage')[0];

            if (!name) {
                alert('Vui lòng nhập tên nhân viên!');
                return;
            }

            if (!fileInput.files[0]) {
                alert('Vui lòng chọn ảnh!');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('name', name);

            $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Đang đăng ký...');

            $.ajax({
                url: `${API_BASE}/employees/register`,
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    alert('Đăng ký thành công!');
                    $('#employeeName').val('');
                    $('#employeeImage').val('');
                    $('#registerBtn').prop('disabled', false).html('<i class="fas fa-save"></i> Đăng Ký');
                    loadEmployeeCount();
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Có lỗi xảy ra!';
                    alert('Lỗi: ' + error);
                    $('#registerBtn').prop('disabled', false).html('<i class="fas fa-save"></i> Đăng Ký');
                }
            });
        });

        // Load today's attendance
        function loadTodayAttendance() {
            $.ajax({
                url: `${API_BASE}/attendance/today`,
                type: 'GET',
                success: function(response) {
                    if (response.success) {
                        displayAttendance(response.attendance);
                        $('#todayCount').text(response.count);
                    }
                },
                error: function() {
                    $('#attendanceList').html('<p class="text-danger">Không thể tải dữ liệu</p>');
                }
            });
        }

        // Load all attendance
        function loadAllAttendance() {
            $.ajax({
                url: `${API_BASE}/attendance/all`,
                type: 'GET',
                success: function(response) {
                    if (response.success) {
                        displayAttendance(response.attendance);
                    }
                },
                error: function() {
                    $('#attendanceList').html('<p class="text-danger">Không thể tải dữ liệu</p>');
                }
            });
        }

        // Display attendance records
        function displayAttendance(records) {
            if (records.length === 0) {
                $('#attendanceList').html('<p class="text-muted text-center">Chưa có dữ liệu chấm công</p>');
                return;
            }

            let html = '<table class="table table-striped table-sm">';
            html += '<thead><tr><th>Tên</th><th>Giờ</th><th>Ngày</th></tr></thead><tbody>';

            records.forEach(record => {
                html += `<tr>
                    <td><strong>${record.NAME}</strong></td>
                    <td>${record.Time}</td>
                    <td>${record.Date}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            $('#attendanceList').html(html);
        }

        // Load employee count
        function loadEmployeeCount() {
            $.ajax({
                url: `${API_BASE}/employees`,
                type: 'GET',
                success: function(response) {
                    if (response.success) {
                        $('#totalEmployees').text(response.count);
                    }
                }
            });
        }

        // Event listeners
        $('#refreshBtn').on('click', loadTodayAttendance);
        $('#viewAllBtn').on('click', loadAllAttendance);

        // Initialize
        $(document).ready(function() {
            loadTodayAttendance();
            loadEmployeeCount();
        });
    </script>
</body>
</html>
