<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap4.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container-fluid {
            max-width: 1400px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .table {
            background: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center text-white mb-4">
            <i class="fas fa-address-book"></i> Quản Lý Khách Hàng
        </h1>

        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-users"></i> Danh Sách Khách Hàng</h4>
                    <button class="btn btn-light" data-toggle="modal" data-target="#addCustomerModal">
                        <i class="fas fa-plus"></i> Thêm Khách Hàng
                    </button>
                </div>
            </div>
            <div class="card-body">
                <table id="customersTable" class="table table-striped table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Email</th>
                            <th>Điện Thoại</th>
                            <th>Số Lượt Ghé</th>
                            <th>Lần Cuối</th>
                            <th>Ghi Chú</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Customer Modal -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm Khách Hàng Mới</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="addCustomerForm">
                        <div class="form-group">
                            <label>Tên khách hàng *</label>
                            <input type="text" class="form-control" id="newName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" id="newEmail">
                        </div>
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="tel" class="form-control" id="newPhone">
                        </div>
                        <div class="form-group">
                            <label>Ghi chú</label>
                            <textarea class="form-control" id="newNotes" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Ảnh khuôn mặt *</label>
                            <input type="file" class="form-control-file" id="newImage" accept="image/*" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="saveCustomerBtn">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Customer Modal -->
    <div class="modal fade" id="editCustomerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chỉnh Sửa Khách Hàng</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="editCustomerForm">
                        <input type="hidden" id="editId">
                        <div class="form-group">
                            <label>Tên khách hàng *</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="tel" class="form-control" id="editPhone">
                        </div>
                        <div class="form-group">
                            <label>Ghi chú</label>
                            <textarea class="form-control" id="editNotes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="updateCustomerBtn">Cập Nhật</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap4.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let table;

        $(document).ready(function() {
            // Initialize DataTable
            table = $('#customersTable').DataTable({
                ajax: {
                    url: `${API_BASE}/customers`,
                    dataSrc: 'customers'
                },
                columns: [
                    { data: 'ID' },
                    { data: 'Name' },
                    { data: 'Email', defaultContent: '-' },
                    { data: 'Phone', defaultContent: '-' },
                    { data: 'VisitCount', defaultContent: 0 },
                    { data: 'LastVisit', defaultContent: '-' },
                    { data: 'Notes', defaultContent: '-' },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <button class="btn btn-sm btn-info" onclick="viewVisits(${row.ID}, '${row.Name}')">
                                    <i class="fas fa-history"></i>
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="editCustomer(${row.ID})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${row.ID}, '${row.Name}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            `;
                        }
                    }
                ],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.10.24/i18n/Vietnamese.json'
                }
            });
        });

        // Save new customer
        $('#saveCustomerBtn').on('click', function() {
            const name = $('#newName').val().trim();
            const email = $('#newEmail').val().trim();
            const phone = $('#newPhone').val().trim();
            const notes = $('#newNotes').val().trim();
            const fileInput = $('#newImage')[0];

            if (!name) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            if (!fileInput.files[0]) {
                alert('Vui lòng chọn ảnh!');
                return;
            }

            $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Đang lưu...');

            // Create customer
            $.ajax({
                url: `${API_BASE}/customers`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ name, email, phone, notes }),
                success: function(response) {
                    // Upload photo
                    const formData = new FormData();
                    formData.append('image', fileInput.files[0]);

                    $.ajax({
                        url: `${API_BASE}/customers/${response.customer_id}/upload-photo`,
                        type: 'POST',
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function() {
                            alert('Thêm khách hàng thành công!');
                            $('#addCustomerModal').modal('hide');
                            $('#addCustomerForm')[0].reset();
                            table.ajax.reload();
                            $('#saveCustomerBtn').prop('disabled', false).html('Lưu');
                        },
                        error: function() {
                            alert('Lỗi khi upload ảnh!');
                            $('#saveCustomerBtn').prop('disabled', false).html('Lưu');
                        }
                    });
                },
                error: function(xhr) {
                    alert('Lỗi: ' + (xhr.responseJSON?.error || 'Không thể thêm khách hàng'));
                    $('#saveCustomerBtn').prop('disabled', false).html('Lưu');
                }
            });
        });

        // Edit customer
        function editCustomer(id) {
            $.ajax({
                url: `${API_BASE}/customers/${id}`,
                type: 'GET',
                success: function(response) {
                    if (response.success) {
                        const customer = response.customer;
                        $('#editId').val(customer.ID);
                        $('#editName').val(customer.Name);
                        $('#editEmail').val(customer.Email);
                        $('#editPhone').val(customer.Phone);
                        $('#editNotes').val(customer.Notes);
                        $('#editCustomerModal').modal('show');
                    }
                }
            });
        }

        // Update customer
        $('#updateCustomerBtn').on('click', function() {
            const id = $('#editId').val();
            const name = $('#editName').val().trim();
            const email = $('#editEmail').val().trim();
            const phone = $('#editPhone').val().trim();
            const notes = $('#editNotes').val().trim();

            if (!name) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Đang cập nhật...');

            $.ajax({
                url: `${API_BASE}/customers/${id}`,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ name, email, phone, notes }),
                success: function(response) {
                    if (response.success) {
                        alert('Cập nhật thành công!');
                        $('#editCustomerModal').modal('hide');
                        table.ajax.reload();
                    }
                    $('#updateCustomerBtn').prop('disabled', false).html('Cập Nhật');
                },
                error: function(xhr) {
                    alert('Lỗi: ' + (xhr.responseJSON?.error || 'Không thể cập nhật'));
                    $('#updateCustomerBtn').prop('disabled', false).html('Cập Nhật');
                }
            });
        });

        // Delete customer
        function deleteCustomer(id, name) {
            if (!confirm(`Bạn có chắc muốn xóa khách hàng "${name}"?`)) {
                return;
            }

            $.ajax({
                url: `${API_BASE}/customers/${id}`,
                type: 'DELETE',
                success: function(response) {
                    if (response.success) {
                        alert('Đã xóa khách hàng!');
                        table.ajax.reload();
                    }
                },
                error: function(xhr) {
                    alert('Lỗi: ' + (xhr.responseJSON?.error || 'Không thể xóa'));
                }
            });
        }

        // View customer visits
        function viewVisits(id, name) {
            alert(`Xem lịch sử ghé thăm của ${name} - Tính năng đang phát triển`);
        }
    </script>
</body>
</html>
